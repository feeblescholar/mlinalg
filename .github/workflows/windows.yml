name: Windows

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CMAKE_BUILD_PARALLEL_LEVEL: 4
  CTEST_PARALLEL_LEVEL: 4
  CMAKE_GENERATOR: Ninja
  CXX: g++

jobs:
  build-and-test:
    name: '[MinGW GCC 16.2.0] ${{ matrix.preset }}'
    runs-on: windows-2025-vs2026
    strategy:
      fail-fast: false
      matrix:
        # MinGW ships no sanitizer runtimes.
        preset: [debug, release]

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          submodules: recursive

      - name: Install CMake and Ninja
        uses: lukka/get-cmake@v4.4.5
        with:
          cmakeVersion: 4.4.5
          ninjaVersion: 1.13.2

      # MSYS2 packages are rolling, so an exact GCC comes from a checksummed WinLibs archive instead.
      - name: Install GCC
        shell: pwsh
        env:
          GCC_URL: https://github.com/brechtsanders/winlibs_mingw/releases/download/16.2.0posix-23.1.3-14.0.0-ucrt-r3/winlibs-x86_64-posix-seh-gcc-16.2.0-mingw-w64ucrt-14.0.0-r3.zip
          GCC_SHA256: 3c69305081e4a647144339a936244fcf7d3d9e558319e1ad7be2cd2886d4b6a1
        run: |
          $zip = "$env:RUNNER_TEMP\gcc.zip"
          curl.exe -fsSL -o $zip $env:GCC_URL
          if ((Get-FileHash $zip -Algorithm SHA256).Hash -ne $env:GCC_SHA256) { throw "GCC checksum mismatch" }
          7z x $zip "-o$env:RUNNER_TEMP" | Out-Null
          Add-Content $env:GITHUB_PATH "$env:RUNNER_TEMP\mingw64\bin"

      - name: Configure, Build and Test
        run: cmake --workflow --preset ${{ matrix.preset }}
