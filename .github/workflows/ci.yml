name: mlinalg CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-build:
    name: '[${{ matrix.os }}] Build and Test'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Dependencies (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y cmake g++ make

      - name: Dependencies (macOS)
        if: matrix.os == 'macos-latest'
        run: brew install cmake make

      - name: MSYS2 Setup (Windows)
        if: matrix.os == 'windows-latest'
        uses: msys2/setup-msys2@v2
        with:
          update: true
          install: base-devel mingw-w64-x86_64-toolchain cmake

      - name: Build (Unix)
        if: matrix.os != 'windows-latest'
        run: make all

      - name: Build (Windows)
        if: matrix.os == 'windows-latest'
        shell: msys2 {0}
        run: make all

      - name: Run Tests (Unix)
        if: matrix.os != 'windows-latest'
        run: ./build/mlinalg_gtest --gtest_color=yes --gtest_break_on_failure

      - name: Run Tests (Windows)
        if: matrix.os == 'windows-latest'
        shell: msys2 {0}
        run: ./build/mlinalg_gtest.exe --gtest_color=yes --gtest_break_on_failure
