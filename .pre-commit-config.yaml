# Global exclusion for top-level directories
exclude: '^(lib/|googletest/|build/|target/|\.github/)'

repos:
  # Standard out-of-the-box hooks for basic file hygiene
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files

  # Official clang-format mirror
  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v23.1.4
    hooks:
      - id: clang-format
        types_or: [c++, c]
        args: ["-style=file", "-Werror", "--dry-run"]

  # Local clang-tidy hook
  - repo: local
    hooks:
      - id: clang-tidy
        name: clang-tidy
        description: Run clang-tidy against the CMake compilation database
        entry: bash -c 'if [ ! -f build/debug/compile_commands.json ]; then cmake --preset debug > /dev/null 2>&1; fi; clang-tidy -p build/debug "$@"' --
        language: python
        additional_dependencies: ["clang-tidy==23.1.4"]
        types_or: [c++]
        require_serial: true
        files: \.(cpp)$
        exclude: '^(lib/|test/|.*googletest/)'
